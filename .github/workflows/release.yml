name: Release

# Native binary release for amld on `v*` tags.
#
# Six-platform matrix (linux/darwin/windows × amd64/arm64) via goreleaser.
# Container image is built independently by .github/workflows/docker.yml
# (native multi-arch ARC runners — NO QEMU).
#
# Runner labels: lux-build self-hosted ARC scale-sets per the org policy.
# GitHub-hosted runners are NOT a permitted fallback.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

# A runner may carry a machine-level go env that routes some module paths around
# the proxy and the checksum database. GOENV=off ignores it, so every module
# resolves through proxy.golang.org and is verified against sum.golang.org — a
# tag that moves later cannot change what gets released.
env:
  GOENV: off

jobs:
  goreleaser:
    runs-on: [self-hosted, linux, amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # goreleaser builds ui/dist in its before-hooks and links with
      # -tags embedui, so the release runner needs the Node toolchain. pnpm must
      # match pnpm-lock.yaml's lockfileVersion (9.0).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Install syft for SBOM
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
