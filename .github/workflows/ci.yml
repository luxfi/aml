name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

# A runner may carry a machine-level go env that routes some module paths around
# the proxy and the checksum database. GOENV=off ignores it, so every module
# resolves through proxy.golang.org and is verified against sum.golang.org — a
# tag that moves later cannot change what this build compiles.
env:
  GOENV: off

jobs:
  ci:
    runs-on: [self-hosted, linux, amd64]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: corepack enable && corepack prepare pnpm@9.15.9 --activate

    - run: go mod download
    - run: go mod verify
    - run: go vet ./...
    - run: go test -race -count=1 ./...
    - run: go build ./...

    # Builds the UI and links it with -tags embedui, the only path that
    # compiles ui/embed_prod.go.
    - run: make build
